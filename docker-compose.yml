services:
  pg:
    image: postgres:16-alpine
    container_name: cafetone-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cafetone
    ports:
      - "5432:5432"
    volumes:
      - cafetone_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 20

volumes:
  cafetone_pgdata:
