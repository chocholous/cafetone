<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Cafetone Barista</title>
  <link rel="manifest" href="/pwa/manifest.json">
  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    :root { --bg: #111; --fg: #fff; --muted: #aaa; --card: #1d1d1d; --accent: #e8a87c; --ok: #2ecc71; --err: #ff6b6b; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--fg);
      padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
      display: flex; flex-direction: column; min-height: 100vh;
    }
    header { padding: 1rem; display: flex; justify-content: space-between; align-items: center; }
    header .brand { font-weight: 600; }
    header button { background: transparent; border: 0; color: var(--muted); font-size: .875rem; cursor: pointer; }
    main { flex: 1; display: flex; flex-direction: column; }

    .login, .scanner { padding: 1rem; }

    .login h1 { margin: 2rem 0 .5rem; font-size: 1.5rem; }
    .login p { color: var(--muted); margin-top: 0; }
    .login form { display: grid; gap: 1rem; margin-top: 2rem; }
    .login input {
      padding: .85rem 1rem; border-radius: .75rem; background: var(--card);
      color: var(--fg); border: 1px solid #2c2c2c; font-size: 1rem;
    }
    .login button {
      padding: 1rem; border-radius: .75rem; border: 0; cursor: pointer;
      background: var(--accent); color: #111; font-weight: 600; font-size: 1rem;
    }

    .scanner-wrap {
      position: relative; flex: 1; background: #000;
      min-height: 320px; overflow: hidden;
    }
    #reader { width: 100%; height: 100%; }
    #reader video { width: 100% !important; height: 100% !important; object-fit: cover; }

    .result {
      position: fixed; inset: auto 0 0 0; padding: 1.5rem 1rem calc(1.5rem + env(safe-area-inset-bottom));
      background: var(--card); border-top: 1px solid #2c2c2c;
      transform: translateY(100%); transition: transform .2s;
    }
    .result.shown { transform: translateY(0); }
    .result h2 { margin: 0 0 .25rem; font-size: 1.5rem; }
    .result p  { margin: 0; color: var(--muted); }
    .result .big { font-size: 3rem; font-weight: 700; line-height: 1; margin: .5rem 0 1rem; }
    .result .actions { display: grid; gap: .5rem; grid-template-columns: 1fr 1fr; margin-top: 1rem; }
    .result button {
      padding: .9rem; border: 0; border-radius: .5rem; font-weight: 600; font-size: 1rem; cursor: pointer;
    }
    .btn-primary { background: var(--accent); color: #111; }
    .btn-secondary { background: transparent; color: var(--muted); border: 1px solid #333 !important; }
    .ok-glow { color: var(--ok); }
    .err-glow { color: var(--err); }

    .toast {
      position: fixed; left: 50%; top: 1rem; transform: translateX(-50%);
      background: var(--card); padding: .5rem 1rem; border-radius: .5rem;
      font-size: .875rem; opacity: 0; transition: opacity .2s;
      border: 1px solid #333;
    }
    .toast.shown { opacity: 1; }
  </style>
</head>
<body>
<header>
  <span class="brand">Cafetone · Barista</span>
  <button id="logout" hidden>Sign out</button>
</header>

<main>
  <section id="login" class="login" hidden>
    <h1>Barista sign-in</h1>
    <p>Enter your email. We'll send a one-tap magic link.</p>
    <form id="login-form">
      <input type="email" id="login-email" required autocomplete="email" placeholder="you@bar.com">
      <button type="submit" id="login-btn">Send magic link</button>
    </form>
    <p id="login-sent" class="ok-glow" hidden>Check your inbox.</p>
  </section>

  <section id="scanner" hidden>
    <div class="scanner-wrap">
      <div id="reader"></div>
    </div>
  </section>
</main>

<div id="result" class="result"></div>
<div id="toast" class="toast"></div>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js" crossorigin="anonymous"></script>
<script src="/pwa/app.js"></script>
</body>
</html>
